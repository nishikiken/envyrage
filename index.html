<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>UPGRADER</title>
  <script>
    // Очистка возможных старых Service Worker и кэшей от других локальных проектов
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var reg of regs) {
          reg.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }
    window.location.replace("./cis/index.html");
  </script>
  <meta http-equiv="refresh" content="0; url=./cis/index.html">
</head>
<body>
  <p>Перенаправление на <a href="./cis/index.html">UPGRADER CIS</a>...</p>
</body>
</html>
