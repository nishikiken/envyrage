<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>UPGRADER</title>
  <script>
    // GitHub Pages SPA router redirect
    var path = window.location.pathname;
    if (path.includes('/admin')) {
      window.location.replace("../admin/index.html");
    } else if (path.includes('/en')) {
      window.location.replace("../en/index.html");
    } else {
      window.location.replace("../cis/index.html");
    }
  </script>
  <meta http-equiv="refresh" content="0; url=./cis/index.html">
</head>
<body>
  <p>Загрузка UPGRADER... <a href="./cis/index.html">Нажмите сюда, если переход не произошел</a></p>
</body>
</html>
