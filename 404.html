<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>UPGRADER</title>
  <script>
    // GitHub Pages SPA hash redirect: converts subpath requests to /#screen_name
    var path = window.location.pathname;
    var match = path.match(/^(\/[^\/]+)/);
    var repoPrefix = (window.location.hostname.includes('github.io') && match) ? match[1] : (path.startsWith('/envyrage') ? '/envyrage' : (path.startsWith('/portfolio') ? '/portfolio' : ''));
    var cleanPath = path.replace(repoPrefix, '').replace(/^\/+/, '');
    var segment = cleanPath.split('/')[0];
    
    var target = 'ru';
    if (segment.includes('profile')) target = 'profile';
    else if (segment.includes('battles')) target = 'battles';
    else if (segment.includes('vip')) target = 'vip';
    else if (segment.includes('settings')) target = 'settings';
    else if (segment.includes('en')) target = 'en';
    else if (segment.includes('portfolio')) target = 'portfolio';

    if (path.includes('/admin')) {
      window.location.replace((repoPrefix || '') + '/admin/index.html');
    } else {
      window.location.replace((repoPrefix || '') + '/#' + target);
    }
  </script>
  <meta http-equiv="refresh" content="0; url=./#ru">
</head>
<body>
  <p>Загрузка UPGRADER... <a href="./#ru">Нажмите сюда, если переход не произошел</a></p>
</body>
</html>
